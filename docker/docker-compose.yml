services:
  # 1. PostgreSQL - Base de données applicative VulnWatch
  postgres:
    image: postgres:15-alpine
    container_name: vulnwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - vulnwatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Wazuh manager — inventaire agents (Syscollector). Pas d'indexer / dashboard.
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: vulnwatch-wazuh
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    entrypoint: ["/bin/bash", "/usr/local/bin/vulnwatch-wazuh-entrypoint.sh"]
    environment:
      API_USERNAME: ${WAZUH_API_USER}
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      WAZUH_ENROLL_PASSWORD: ${WAZUH_ENROLL_PASSWORD}
      TZ: ${TZ}
      AUTO_ENROLLMENT_ENABLED: "true"
    volumes:
      - wazuh-api:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - ./configs/wazuh/docker-entrypoint.sh:/usr/local/bin/vulnwatch-wazuh-entrypoint.sh:ro
      - ./configs/wazuh/agent.conf:/wazuh-config-mount/etc/shared/default/agent.conf:ro
      - ./configs/wazuh/entrypoint-scripts:/entrypoint-scripts:ro
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"
      - "${WAZUH_ENROLL_PORT:-1515}:1515"
      - "127.0.0.1:${WAZUH_API_HOST_PORT:-55000}:55000"
    networks:
      - vulnwatch-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:55000/ | grep -Eq '401|403'",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s

  # 3. n8n - Orchestration (SQLite dédié, isolé de la DB app)
  n8n:
    image: n8nio/n8n:latest
    container_name: vulnwatch-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: ${N8N_PORT}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_USER_FOLDER: /home/node/.n8n
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: "${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}"
      N8N_WEBHOOK_URL: "${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}/"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NVD_API_KEY: ${NVD_API_KEY}
      ENGINE_URL: http://engine:8000
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "${N8N_PORT}:5678"
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    networks:
      - vulnwatch-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 4. VulnWatch Engine - API Python
  engine:
    build:
      context: ../engine
      dockerfile: Dockerfile
    container_name: vulnwatch-engine
    restart: unless-stopped
    environment:
      ENGINE_PORT: ${ENGINE_PORT}
      ENGINE_SECRET_KEY: ${ENGINE_SECRET_KEY}
      ENGINE_DEBUG: ${ENGINE_DEBUG}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      WAZUH_API_URL: ${WAZUH_API_URL}
      WAZUH_API_USER: ${WAZUH_API_USER}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD}
      TZ: ${TZ}
    volumes:
      - engine-data:/app/data
      - ../reports:/app/reports
    ports:
      - "${ENGINE_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    networks:
      - vulnwatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 5. Grafana - Dashboards + alertes UI (métadata sqlite locale)
  grafana:
    image: grafana/grafana:latest
    container_name: vulnwatch-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT}
      GF_SERVER_HTTP_PORT: 3000
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vulnwatch-soc-ops.json
      GF_FEATURE_TOGGLES_newHomePage: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ""
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vulnwatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/postgres
  wazuh-api:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/api
  wazuh-etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/etc
  wazuh-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/logs
  wazuh-queue:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/queue
  wazuh-multigroups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/multigroups
  wazuh-integrations:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/integrations
  wazuh-active-response:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/active-response
  wazuh-agentless:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/agentless
  wazuh-wodles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/wazuh/wodles
  n8n-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/n8n
  engine-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/engine
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../volumes/grafana

networks:
  vulnwatch-network:
    driver: bridge
    name: vulnwatch-network
