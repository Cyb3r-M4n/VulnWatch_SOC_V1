<!-- Config partagée poussée aux agents Wazuh.
     Syscollector alimente assets / software / processes dans VulnWatch.
     Le module vulnérabilités Wazuh n'est PAS utilisé. -->
<agent_config>
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <hotfixes>yes</hotfixes>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>
</agent_config>
